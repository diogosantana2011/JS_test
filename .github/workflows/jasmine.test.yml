name: Jasmine Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:latest
        options: --health-cmd="curl --silent --fail localhost:27017 || exit 1" --health-interval=10s --health-timeout=5s --health-retries=5
        ports:
          - 27017:27017

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Wait for MongoDB to be ready
      run: |
        # Ensure MongoDB is available before proceeding
        until nc -z localhost 27017; do
          echo "Waiting for MongoDB to be available..."
          sleep 1
        done
        echo "MongoDB is ready!"

    - name: Run tests
      run: npm test

    - name: Clean up MongoDB data
      run: |
        docker exec -it mongodb mongo --eval "db.dropDatabase()"