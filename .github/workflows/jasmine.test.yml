name: CI with Jasmine Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16'

    - name: Install dependencies
      run: npm install

    - name: Run Jasmine tests
      run: npx jasmine

    - name: Upload test results (optional)
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: ./results