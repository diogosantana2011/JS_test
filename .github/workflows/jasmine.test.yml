name: Run Jasmine Tests

on:
  push:
    branches:
      - main
      - "develop"  # If you want it to run on other branches like `develop`
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16'  # Specify the version of Node.js you want to use

    - name: Install dependencies
      run: |
        npm install

    - name: Run Jasmine tests
      run: |
        npx jasmine  # Runs the Jasmine tests
    # Only upload results if tests fail
    - name: Upload test results (optional)
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: ./results  # Replace with your test output location