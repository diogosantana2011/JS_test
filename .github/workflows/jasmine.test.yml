name: MongoDB Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:latest
        options: --health-cmd="curl --silent --fail localhost:27017 || exit 1" --health-interval=10s --health-timeout=5s --health-retries=5
        ports:
          - 27017:27017

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Install dependencies
      run: npm install

    - name: Wait for MongoDB to be ready
      run: |
        # Use wait-for-it to wait until MongoDB is available
        wget https://raw.githubusercontent.com/vishnubob/wait-for-it/master/wait-for-it.sh
        chmod +x wait-for-it.sh
        ./wait-for-it.sh localhost:27017 --timeout=30 --strict -- echo "MongoDB is ready!"

    - name: Run MongoDB tests
      env:
        MONGO_URI: mongodb://localhost:27017
      run: npm test

    - name: Clean up MongoDB data
      run: |
        docker exec -it mongodb mongo --eval "db.dropDatabase()"